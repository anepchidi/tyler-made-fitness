# Alembic Configuration
# This file should be placed in the root of the project (alongside main.py, models.py, etc.)
# To use Alembic with this project:
# 1. Install: pip install alembic
# 2. Initialize: alembic init alembic (already done)
# 3. Configure sqlalchemy.url in this file
# 4. Run migrations: alembic upgrade head

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
